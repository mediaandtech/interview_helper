<!doctype html>
<html lang="ko" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>셀프 모니터 디자인 시스템</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/basecoat/basecoat.cdn.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* 이 페이지 자체의 배치(앱에는 쓰이지 않음) */
    body { display: block; overflow: auto; height: auto; }
    .sg { max-width: 1180px; margin: 0 auto; padding: var(--space-8) var(--space-5) 80px; }
    .sg h1 { font-size: 28px; margin: 0 0 var(--space-2); }
    .sg > h2 { font-size: var(--fs-title); margin: var(--space-8) 0 var(--space-3); padding-bottom: var(--space-2); border-bottom: 1px solid var(--border); }
    .sg h3 { font-size: var(--fs-body); color: var(--muted-foreground); margin: var(--space-5) 0 var(--space-2); font-weight: 600; }
    .sg code { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--chart-1); }
    .lead { color: var(--muted-foreground); margin: 0; max-width: 760px; }
    .grid { display: grid; gap: var(--space-3); }
    .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
    .sw { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
    .sw i { display: block; height: 48px; }
    .sw div { padding: var(--space-2) var(--space-3); font-size: var(--fs-caption); }
    .sw b { display: block; font-size: var(--fs-body); }
    .typerow { display: grid; grid-template-columns: 180px 1fr; align-items: baseline; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--border); }
    .space { display: flex; align-items: flex-end; gap: var(--space-4); }
    .space i { display: block; background: var(--chart-2); }
    .space small { display: block; color: var(--muted-foreground); margin-top: 4px; }
    .principles { list-style: decimal; padding-left: 22px; }
    .principles li { margin: 4px 0; }
    .demo-cam { position: relative; height: 140px; border-radius: 12px; background: var(--video); border: 1px solid var(--border); }
    @media (max-width: 900px) { .g4, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
<main class="sg" id="sg"></main>
<script type="module">
  import { THEME, SERIES_COLORS } from './js/config.js';
  import { button, badge, card, field, switchField, segmented, tabs, bindTabs, statGrid, metricCard, checklist, emptyState, dataTable, topBar, createGauge, createProgress } from './js/ui/components.js';

  const sw = (list) => list.map(([name, token, hex, use]) =>
    `<div class="sw"><i style="background:var(${token})"></i><div><b>${name}</b><code>${token}</code> · ${hex}<br><span class="hint">${use}</span></div></div>`).join('');

  document.getElementById('sg').innerHTML = `
  <h1>셀프 모니터 디자인 시스템</h1>
  <p class="lead">Basecoat UI(shadcn/ui 디자인 언어) 다크 테마 위에 앱 토큰과 배치를 얹었습니다. 이 페이지의 모든 부품은 실제 앱과 같은 <code>js/ui/components.js</code> 함수와 CSS로 그려집니다.</p>

  <h2>원칙</h2>
  <ol class="principles">
    <li><b>측정값은 판정하지 않는다.</b> 범위 밖이어도 색을 바꾸지 않고, 중립 문구(참고 범위 안/위/아래, 기준 대비 변화)로만 표시.</li>
    <li><b>참고 범위는 위치만.</b> 게이지·그래프의 옅은 띠로 어디쯤인지 보여 줄 뿐 좋고 나쁨을 칠하지 않음.</li>
    <li><b>빨강은 두 곳에만.</b> 녹화 중 표시, 삭제·끝내기 같은 되돌리기 어려운 동작.</li>
    <li><b>카드 하나에 한 가지.</b> 제목 → 설명 → 내용 → 동작(footer).</li>
    <li><b>숫자는 고정폭.</b> 값이 바뀌어도 폭이 흔들리지 않게 <code>tabular-nums</code>.</li>
    <li><b>오프라인.</b> 라이브러리·글꼴을 인터넷에서 불러오지 않음(시스템 글꼴 + Apple SD Gothic Neo).</li>
    <li><b>키보드로도.</b> 모든 버튼·탭·입력에 포커스 테두리, 탭은 ←/→ 키로 이동.</li>
  </ol>

  <h2>색</h2>
  <h3>면과 글자 (Basecoat 다크 토큰)</h3>
  <div class="grid g4">${sw([
    ['배경', '--background', THEME.bg, '페이지'], ['카드', '--card', THEME.card, '카드·패널'], ['약한 면', '--muted', THEME.muted, '배지·트랙·탭'],
    ['테두리', '--border', THEME.border, '구분선'], ['글자', '--foreground', THEME.text, '본문·숫자'], ['보조 글자', '--muted-foreground', THEME.mutedText, '설명·라벨'],
    ['주 버튼', '--primary', '#e5e5e5', '가장 중요한 동작'], ['위험', '--destructive', '#ff6467', '녹화 중·삭제·끝내기'],
  ])}</div>
  <h3>그래프 선 (--chart-*)</h3>
  <div class="grid g4">${sw([
    ['속도 · 음높이', '--chart-1', SERIES_COLORS.rate, '선'], ['음량', '--chart-2', SERIES_COLORS.volume, '선'],
    ['정면 범위 안', '--chart-3', SERIES_COLORS.gazeIn, '시선 띠'], ['참고 범위 띠', '--range-band', 'foreground 22%', '위치 표시'],
  ])}</div>

  <h2>글자</h2>
  ${[['--fs-clock', '01:24', '모니터링 중 타이머'], ['--fs-stat', '82%', '관찰 요약 숫자'], ['--fs-metric', '참고 범위 안', '지표 카드 문구'],
     ['--fs-title', '단계별 결과', '카드 제목'], ['--fs-lead', '● 정면  누적 84%', '시선 알약·안내'], ['--fs-body', '본문, 표, 입력', '본문'], ['--fs-caption', '말하기 속도 · 음절/분', '라벨·도움말(최소)']]
    .map(([t, txt, use]) => `<div class="typerow"><code>${t}<br><span class="hint">${use}</span></code><div style="font-size:var(${t});font-weight:${t === '--fs-body' || t === '--fs-caption' ? 400 : 700};font-variant-numeric:tabular-nums">${txt}</div></div>`).join('')}

  <h2>간격 (4px 단위)</h2>
  <div class="space">${[1, 2, 3, 4, 5, 6, 8].map((n) => `<div><i style="width:var(--space-${n});height:var(--space-${n})"></i><small>--space-${n}</small></div>`).join('')}</div>

  <h2>부품</h2>
  <h3>상단 바 — topBar()</h3>
  <div class="card" style="padding:0;overflow:hidden">${topBar({ step: 'practice' })}</div>

  <h3>버튼 — button()</h3>
  <div class="row">
    ${button({ label: '모니터링 시작', size: 'lg' })}${button({ label: '같은 조건으로 다시 하기' })}${button({ label: '이전 기록과 비교', variant: 'outline' })}
    ${button({ label: '데모로 체험', variant: 'ghost' })}${button({ label: '모니터링 끝내기 (Esc)', variant: 'destructive' })}
    ${button({ label: '메모 추가', size: 'sm' })}${button({ label: '비활성', attrs: 'disabled' })}
  </div>

  <h3>배지 — badge()</h3>
  <div class="row">${badge({ label: '이름표', variant: 'secondary' })}${badge({ label: '고개 정면', variant: 'outline' })}${badge({ label: '● 녹화 중', variant: 'destructive' })}${badge({ label: '기본' })}</div>

  <h3>카드 · 입력 — card() field() switchField() segmented()</h3>
  <div class="grid g2">
    ${card({ title: '연습 이름표 (선택)', description: '화면 속 내 목소리와 시선을 보면서 스스로 분석해요. 점수나 자동 평가는 없어요.', html: `<div class="stack">
      ${field({ label: '이름표 (같은 이름표끼리 비교해요)', forId: 'sg-q', controlHtml: '<textarea class="textarea" id="sg-q" rows="2" placeholder="예: 지원 동기 · 1차"></textarea>' })}
      ${field({ label: '참고 범위 프리셋', controlHtml: segmented({ name: 'sg', value: 'b', options: [{ value: 'a', label: '수업 발표' }, { value: 'b', label: '화상 면접' }, { value: 'c', label: '피칭·공모전' }] }) })}
      ${field({ label: '목표 시간', controlHtml: '<div class="inline"><input class="input num" value="2"> 분 <input class="input num" value="0"> 초</div>', hint: '시간이 지나도 측정은 계속돼요.' })}</div>`,
      footerHtml: `${button({ label: '다시 측정', variant: 'outline' })}${button({ label: '모니터링 시작', size: 'lg' })}` })}
    ${card({ title: '기록 방식', html: `<div class="stack">${switchField({ id: 'sg-a', label: '화면과 목소리를 녹화·녹음해서 다시 보기', hint: '이 탭에만 보관돼요.' })}${switchField({ id: 'sg-b', label: '말하는 동안 측정값 숨기기', hint: '끝난 뒤 분석 화면에서 확인해요.', checked: false })}
      ${field({ label: '비교할 기록', forId: 'sg-s', controlHtml: '<select class="select" id="sg-s"><option>기록 2 · 오후 1:58</option></select>' })}
      ${field({ label: '확인할 위치', forId: 'sg-r', controlHtml: '<input class="input" id="sg-r" type="range" min="0" max="100" value="35">' })}</div>` })}
  </div>

  <h3>탭 — tabs() + bindTabs()</h3>
  <div class="grid g2">${card({ title: '메모', html: tabs({ id: 'sg-memo', selected: 'here', items: [
    { id: 'here', label: '현재 위치', html: '<p class="hint">0:39 위치에 남긴 메모가 여기에 보여요.</p>' },
    { id: 'all', label: '전체 메모', html: '<p class="hint">이번 기록 전체에 대한 생각을 적어요.</p>' }] }) })}
    ${card({ title: '준비 확인 — checklist()', html: checklist([{ key: 'a', title: '카메라를 정면으로 바라보세요' }, { key: 'b', title: '아래 문장을 평소 목소리로 읽어 주세요' }]) + '<div class="progress" style="margin-top:12px"><span style="width:62%"></span></div>' })}</div>

  <h3>관찰 요약 — statGrid() · 표 — dataTable() · 빈 상태 — emptyState()</h3>
  <div class="grid g3">
    ${card({ title: '관찰 요약', html: statGrid([{ label: '정면 범위 안', value: '82%', sub: '얼굴 검출 1:52 기준' }, { label: '속도 추정 평균', value: '288', sub: '음절/분' }]) })}
    ${card({ title: '참고 범위와 다른 구간', html: dataTable({ columns: ['시작', '내용', '길이'], rowsHtml: ['<tr><td>0:34</td><td>정면 범위 밖</td><td>5.0초</td></tr>', '<tr><td>1:36</td><td>기준보다 작은 음량</td><td>18.0초</td></tr>'] }) })}
    ${card({ className: 'video-card', html: emptyState({ title: '녹화가 없어요', text: '녹화하지 않은 기록입니다.' }) })}
  </div>

  <h3>모니터링 중 표시 — metricCard() · 게이지 · 진행 막대 · 시선 알약</h3>
  <div class="grid g3">
    ${metricCard({ id: 'sg-rate', title: '말하기 속도 · 음절/분', numId: 'sg-rate-n', stateId: 'sg-rate-s', extraHtml: '<div id="sg-g1"></div>' })}
    ${metricCard({ id: 'sg-vol', title: '목소리 크기', numId: 'sg-vol-n', stateId: 'sg-vol-s', extraHtml: '<div id="sg-g2"></div>' })}
    <div class="card"><section class="stack"><div id="sg-pb"></div><div class="demo-cam"><div class="gaze-head"><div class="gaze-pill"><span class="dot"></span><span>정면</span><span class="cum">누적 84%</span></div></div></div></section></div>
  </div>`;

  bindTabs(document.getElementById('sg'));
  document.getElementById('sg-rate-n').textContent = '288'; document.getElementById('sg-rate-s').textContent = '참고 범위 안';
  document.getElementById('sg-vol-n').textContent = '−4.0 dB'; document.getElementById('sg-vol-s').textContent = '기준 대비 변화';
  createGauge(document.getElementById('sg-g1'), { min: 180, max: 420, lo: 270, hi: 330, left: '느림', right: '빠름' }).update(288, 'idle');
  createGauge(document.getElementById('sg-g2'), { min: -15, max: 15, lo: -6, hi: 8, left: '작음', right: '큼' }).update(-4, 'idle');
  createProgress(document.getElementById('sg-pb')).update(0.35, 'idle');
</script>
</body>
</html>
