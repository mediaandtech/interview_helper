name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, pinned Node)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify Windows environment helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/use-node.ps1 -CheckOnly
      - run: npm ci
      - run: npm run doctor
      - run: npm test

  browser:
    name: Browser checks (${{ matrix.os }}, Chromium)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-check-images-${{ matrix.os }}
          path: .artifacts/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
