name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, pinned Node)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify Windows environment helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/use-node.ps1 -CheckOnly
      - run: npm ci
      - run: npm run doctor
      - run: npm test
